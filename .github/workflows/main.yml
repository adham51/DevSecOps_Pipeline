name: CI 

on: 
 push:
 workflow_dispatch:


permissions:
  contents: read
  security-events: write # allows github actions to upload sarif to github security tab 
  
jobs:
# 1) Secret scanning using gitleaks
 secret_scanning:
   name: run gitleaks
   runs-on: ubuntu-latest

   steps:
     - name: checkout code
       uses: actions/checkout@v5
       with:
          fetch-depth: 0
     
     - name: run gitleaks
       uses: gitleaks/gitleaks-action@v2
       env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Code Quality & SAST using SonarCloud
 sonarqube_scan:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: secret_scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

 # 2) SAST scanning using Bandit
      
 sast_scan:
   name: Run Bandit scan
   runs-on: ubuntu-latest
   needs: secret_scanning
   
   steps:
     - name: checkout our code
       uses: actions/checkout@v5

     - name: install python
       uses: actions/setup-python@v5
       with:
        python-version: 3.8

     - name: installing Bandit
       run: pip install "bandit[sarif]"
     
     - name: running bandit scan
       run: bandit -lll -ii -r . -f sarif -o bandit-report.sarif # -r scans current directory, -lll ignores medium and low severity
       
     - name: upload artifcacts to save json
       uses: actions/upload-artifact@v7.0.1
       if: always()
       with: 
        name: bandit-findings
        path: bandit-report.sarif

     - name: Upload Bandit SARIF to GitHub Security Tab
       uses: github/codeql-action/upload-sarif@v3
       if: always()
       with:
          sarif_file: bandit-report.sarif
          category: bandit-sast
        
 # 3) SCA scanning using Trivy + SBOM creation
     
 SCA_Scan:
    name: Run Trivy SCA on dependancies
    runs-on: ubuntu-latest 
    needs: secret_scanning

    steps:
      - name: checkout my code
        uses: actions/checkout@v5

      - name: Run Trivy Vulnerability Scanner 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs' # fs for file structure or software composition analysis SCA scan 
          scan-ref: '.' 
          format: 'sarif'
          output: 'trivy-SCA-report.sarif'  
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # fails if high or critical are found

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: trivy-SCA-report
          path: trivy-SCA-report.sarif

      - name: Upload SARIF to GItjub Actions security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-SCA-report.sarif
          category: trivy-SCA

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        if: always() 
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'
          
      - uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: sbom
          path: sbom.json

 # 4) Image scanning using Trivy

 container-security:
    name: Container Build & Scan
    runs-on: ubuntu-latest
    needs: secret_scanning
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-app:latest

      - name: Scan Container Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'my-app:latest'
          format: 'sarif'
          output: 'trivy-container-report.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '0' # Ensures the step completes so SARIF can upload

      - name: Upload Container Image SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container-report.sarif
          category: trivy-container-image

      - name: Upload Container Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-report
          path: trivy-container-report.sarif
          
 dast_scan:
    name: Run OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: secret_scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: my-app:latest

      - name: Start Application Locally & Check Logs
        run: |
          # Start the container and name it 'pygoat'
          docker run -d -p 8000:8000 --name pygoat my-app:latest
          
          # Wait 15 seconds for the database/server to boot up
          sleep 15
          
          # Print the running containers to verify it didn't crash
          docker ps
          
          # Print the container logs so we can see any Python errors if it did crash!
          docker logs pygoat

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000'
          fail_action: false # Keeps pipeline green while baselining

      # Since ZAP doesn't output SARIF by default, we upload its HTML report instead
      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html
