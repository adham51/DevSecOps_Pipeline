name: CI 

on: 
 push:
 workflow_dispatch:


permissions:
  contents: read

jobs:
 secret_scanning:
   name: run gitleaks
   runs-on: ubuntu-latest

   steps:
     - name: checkout code
       uses: actions/checkout@v5
       with:
          fetch-depth: 0
     
     - name: run gitleaks
       uses: gitleaks/gitleaks-action@v2
       env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

       
 sast_scan:
   name: Run Bandit scan
   runs-on: ubuntu-latest
   needs: secret_scanning
   
   steps:
     - name: checkout our code
       uses: actions/checkout@v5

     - name: install python
       uses: actions/setup-python@v5
       with:
        python-version: 3.8

     - name: installing Bandit
       run: pip install Bandit
     
     - name: running bandit scan
       run: bandit -lll -ii -r . -f json -o bandit-report.json # -r scans current directory, -lll ignores medium and low severity
       
     - name: upload artifcacts to save json
       uses: actions/upload-artifact@v7.0.1
       if: always()
       with: 
        name: bandit-findings
        path: bandit-report.json

  SCA_Scan:
    name: Run Trivy SCA on dependancies
    runs-on: ubuntu-latest 
    needs: secret_scanning

    steps:
      - name: checkout my code
        uses: actions/checkout@v5

      - name: Run Trivy Vulnerability Scanner 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs' # fs for file structure or software composition analysis SCA scan 
          scan-ref: '.' # Scans current repo
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Fails build if HIGH or CRITICAL CVEs are found in dependencies
    
   
